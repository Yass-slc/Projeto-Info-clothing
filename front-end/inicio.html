<!-- EVASÊ-->
<div class="container6">
  
    <figure class="img-lateral2">
      <img src="Assets/IMG/evase.jpg" alt="blusher" style="height: 330px; width: 210px;">
      <figcaption><b>VESTIDO EVASÊ:</b>  <br><BR>
        <b>Principais Características:</b><br>
        <b>Silhueta em "A":</b> A principal característica é a saia
         que alarga suavemente a partir da cintura,
          assemelhando-se à letra "A".<br>
        <b>Caimento:</b> Leve, fluido e confortável, ideal para o
         dia a dia ou ocasiões formais.<br>
        <b>Versatilidade:</b> Veste bem diferentes tipos físicos,
         pois não aperta o quadril.</figcaption>
    </figure>

<!--SEREIA-->

    <figure class="img-lateral2">
      <img src="Assets/IMG/sereia.jpeg" alt="blusher" style="height: 330px; width: 210px;">
      <figcaption><b>VESTIDO SEREIA:</b><br><br>
        <b>Principais Características:</b><br>
        <b>Modelagem:</b> Ajustada ao corpo (busto, cintura e quadril), abrindo em "cauda de peixe" na parte inferior.<br>
        <b>Silhueta:</b> Enfatiza o formato ampulheta.<br>
        <b>Variações:</b> Pode ser o sereia 
        clássico (aperto até o joelho) ou o semi-sereia (ajustado até o quadril), que oferece maior 
        mobilidade.<br>
</figcaption>
    </figure>
</div>

<!--IMPÉRIO-->
<div class="container7">

    <figure class="img-lateral2">
      <img src="Assets/IMG/vestido evasê aaa.webp" alt="blusher" style="height: 330px; width: 210px;">
      <figcaption><b>VESTIDO IMPÉRIO:</b></span><br><br>
        <b>Principais Características:</b><br>
        <b>Cintura Alta:</b> A costura principal situa-se logo abaixo do busto, e não na cintura natural.<br>
        <b>Saia Fluida:</b> A saia, seja evasê ou solta, contorna o corpo sem volume excessivo de anáguas.<br>
        <b>Decotes e Mangas:</b> Comumente possui decote quadrado, canoa ou em V, com opções de alças finas ou
        mangas variadas.<br></figcaption>
    </figure>
  

<!--PRINCESA-->
    <figure class="img-lateral2">
      <img src="Assets/IMG/princesa2.jpg" alt="blusher" style="height: 330px; width: 210px;">
      <figcaption><b>VESTIDO PRINCESA</b></span><br><br>
        <b>Principais Características:</b><br>
        <b>Volume da saia:</b> A saia é o grande destaque, podendo ter diversas camadas de tecidos encorpados garantindo amplitude.<br>
        <b>Cintura Marcada:</b> O modelo foca na definição da cintura, por vezes utilizando a cintura basque, para alongar o tronco.<br>
        <b>Decotes e Mangas:</b> O decote coração é muito comum, adaptando-se a decotes ombro a ombro, tomara-que-caia ou com mangas.<br></figcaption>
    </figure> </div>


<!--RETO-->
<div class="container8">

    <figure class="img-lateral2">
      <img src="Assets/IMG/retoo.webp" alt="blusher" style="height: 330px; width: 210px;">
      <figcaption><b>VESTIDO RETO:</b></span><br><br>
        <b>Principais Características:</b><br>
         <b>Caimento Fluido:</b> A saia cai de forma suave, sem o volume de modelos princesa ou evasê.<br>
         <b>Minimalismo e Simplicidade:</b> Geralmente liso, sem bordados ou pedrarias, investindo na sofisticação do tercido e corte.<br>
         <b>Silhueta Longilínea:</b> Possui um corte vertical que acompanha o corpo sem marcá-lo exageradamente, alongando a figura.<br>
       </figcaption>
    </figure>

    <!--mullet-->
    <figure class="img-lateral2">
      <img src="Assets/IMG/VESTIDO MULLET.jpg" alt="blusher" style="height: 330px; width: 210px;">
      <figcaption><b>VESTIDO MULLET:</b></span><br><br>
        <b>Principais Características:</b><br>
         <b>Variedade de Modelos:</b> Pode ser encontrado com diferentes decotes (frente única, ombro a ombro, em V) incluindo camadas ou cortes mais retos e minimalista<br>
         <b>Assimetria Estruturada:</b> O contraste de comprimentos cria um visual dinâmico, garantindo destaque para as pernas na 
         parte frontal enquanto mantém o charme e a formalidade na cauda traseira.<br>
       </figcaption>
    </figure> </div>
