<div class="form-card1">

    <div class="form-card2">

        <form class="form" id="formContato">

            <div class="noivas">

                <img 
                    src="Assets/IMG/Noivasssss.png"
                    alt="Imagem de noivas"
                >

            </div>


            <div class="contatos">

                <p class="form-heading">
                    Envie-nos sua mensagem
                </p>


                <div class="form-field">

                    <input
                        required
                        placeholder="Nome"
                        class="input-field"
                        id="Nome"
                        name="nome"
                        type="text"
                    >

                </div>


                <div class="form-field">

                    <input
                        required
                        placeholder="Email"
                        class="input-field"
                        id="Email"
                        name="email"
                        type="email"
                    >

                </div>


                <div class="form-field">

                    <input
                        required
                        placeholder="Assunto"
                        class="input-field"
                        id="Assunto"
                        name="assunto"
                        type="text"
                    >

                </div>


                <div class="form-field">

                    <textarea
                        required
                        placeholder="Mensagem"
                        rows="4"
                        id="Mensagem"
                        name="mensagem"
                        class="input-field"
                    ></textarea>

                </div>


                <button
                    class="sendMessage-btn"
                    type="submit"
                >
                    Enviar
                </button>


                <!-- Mensagem exibida após o envio -->

                <div
                    class="mensagem-sucesso"
                    id="mensagemSucesso"
                    role="status"
                    aria-live="polite"
                >
                    ✓ Sua mensagem foi enviada com sucesso!
                    <br>
                    Obrigado por entrar em contato conosco.
                </div>

            </div>

        </form>

    </div>

</div>


<script>

const formContato = document.getElementById("formContato");

const mensagemSucesso = document.getElementById("mensagemSucesso");


formContato.addEventListener("submit", function(event) {

    // Impede o comportamento padrão do formulário
    event.preventDefault();


    // Verifica se todos os campos estão preenchidos
    if (!formContato.checkValidity()) {

        formContato.reportValidity();

        return;

    }


    // Altera o texto do botão enquanto processa
    const botao = formContato.querySelector(".sendMessage-btn");

    botao.disabled = true;

    botao.textContent = "Enviando...";


    /*
       Aqui você poderá conectar o formulário
       ao serviço de envio de e-mail.
    */


    setTimeout(function() {

        // Mostra mensagem de sucesso
        mensagemSucesso.classList.add("ativa");


        // Limpa os campos
        formContato.reset();


        // Restaura o botão
        botao.disabled = false;

        botao.textContent = "Enviar";


    }, 1000);

});

</script>
